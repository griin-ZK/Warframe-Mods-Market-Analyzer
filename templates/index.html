<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Syndicate Analyzer</title>
    <style>
        /* Variabili di colore stile Void/Oro/Scuro di Warframe */
        :root {
            --bg-main: #0a0e14;
            --bg-card: #141a24;
            --bg-card-selected: #1c2636;
            --text-main: #f0f3f8;
            --text-muted: #8a96a8;
            --accent: #ffb800; /* Oro Orokin */
            --accent-glow: rgba(255, 184, 0, 0.2);
            --border: #242f42;
            --border-selected: #ffb800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-top: 110px; /* Aumentato per lasciare spazio alla navbar fissa (70px altezza + spazio) */
            padding-bottom: 40px;
            padding-left: 20px;
            padding-right: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #101620, #0d121a);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* La Griglia dei Sindacati */
        .syndicate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        /* Nascondiamo la checkbox nativa brutta */
        .syndicate-checkbox {
            display: none;
        }

        /* La Card cliccabile */
        .syndicate-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .syndicate-card:hover {
            border-color: var(--text-muted);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Stile quando la checkbox nascosta è selezionata */
        .syndicate-checkbox:checked + .syndicate-card {
            background-color: var(--bg-card-selected);
            border-color: var(--border-selected);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .syndicate-name {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            text-transform: capitalize;
        }

        /* Effetto pallino di selezione dentro la card */
        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--border);
            transition: all 0.2s ease;
        }

        .syndicate-checkbox:checked + .syndicate-card .indicator {
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        /* Bottone di Invio */
        .btn-container {
            text-align: center;
        }

        .submit-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .submit-btn:hover {
            background-color: #ffca43;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 184, 0, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
        .tool-navbar {
            position: fixed;       /* Fissa la barra in alto */
            top: 0;                /* Attacca al bordo superiore */
            left: 0;
            width: 100%;           /* Occupa tutta la larghezza */
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: #0a0e14;
            border-bottom: 2px solid var(--border);
            z-index: 1000;         /* Assicura che stia sopra ogni altro elemento */
        }

        .nav-item {
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-item.active {
            color: var(--accent); /* Il giallo del tuo brand */
            border-bottom: 2px solid var(--accent); /* Sottolineatura per indicare dov'è l'utente */
        }
    </style>
</head>
<body>
<nav class="tool-navbar">
    <a href="/" class="nav-item {{ 'active' if active_page == 'syndicates' }}">Syndicate Analyzer</a>
    <a href="/galvs" class="nav-item {{ 'active' if active_page == 'galvs' }}">Galvanized Market</a>
</nav>

<div class="container">
    <header>
        <h1>Syndicate <span>Market Analyzer</span></h1>
        <p>Select one or more <span>Syndicates</span> to get the best mods to farm at the moment</p>
    </header>

    <form action="/syndicates" method="POST">
        
        <div class="syndicate-grid">
            
            <label>
                <input type="checkbox" name="factions" value="steelmeridian" class="syndicate-checkbox">
                <div class="syndicate-card">
                    <div class="indicator"></div>
                    <div class="syndicate-name">Steel Meridian</div>
                </div>
            </label>

            <label>
                <input type="checkbox" name="factions" value="arbitersofhexis" class="syndicate-checkbox">
                <div class="syndicate-card">
                    <div class="indicator"></div>
                    <div class="syndicate-name">Arbiters of Hexis</div>
                </div>
            </label>

            <label>
                <input type="checkbox" name="factions" value="cephalonsuda" class="syndicate-checkbox">
                <div class="syndicate-card">
                    <div class="indicator"></div>
                    <div class="syndicate-name">Cephalon Suda</div>
                </div>
            </label>

            <label>
                <input type="checkbox" name="factions" value="perrinsequence" class="syndicate-checkbox">
                <div class="syndicate-card">
                    <div class="indicator"></div>
                    <div class="syndicate-name">The Perrin Sequence</div>
                </div>
            </label>

            <label>
                <input type="checkbox" name="factions" value="redveil" class="syndicate-checkbox">
                <div class="syndicate-card">
                    <div class="indicator"></div>
                    <div class="syndicate-name">Red Veil</div>
                </div>
            </label>

            <label>
                <input type="checkbox" name="factions" value="newloka" class="syndicate-checkbox">
                <div class="syndicate-card">
                    <div class="indicator"></div>
                    <div class="syndicate-name">New Loka</div>
                </div>
            </label>

        </div>

        <div class="btn-container">
            <button type="submit" class="submit-btn">Start Market Analysis</button>
        </div>
        
    </form>
</div>

</body>
</html>
